<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Terra Digester favicon">
  <title>Terra Digester</title>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#52b788"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Sprouting leaf glyph — represents organic waste → nutrient cycle -->
  <path d="M32 12 C 32 12, 20 18, 20 30 C 20 38, 26 44, 32 44 C 38 44, 44 38, 44 30 C 44 18, 32 12, 32 12 Z"
        fill="none" stroke="#1b3a2d" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Midrib -->
  <path d="M32 14 L 32 44" stroke="#1b3a2d" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Two side veins -->
  <path d="M32 22 L 26 28" stroke="#1b3a2d" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <path d="M32 22 L 38 28" stroke="#1b3a2d" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <path d="M32 30 L 24 38" stroke="#1b3a2d" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <path d="M32 30 L 40 38" stroke="#1b3a2d" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <!-- Small biogas bubble accent -->
  <circle cx="48" cy="18" r="3" fill="#d8f3dc" opacity="0.85"/>
  <circle cx="16" cy="46" r="2" fill="#d8f3dc" opacity="0.7"/>
</svg>
