<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 88" role="img" aria-label="Terra Digester — anaerobic digestion systems">
  <title>Terra Digester</title>
  <defs>
    <linearGradient id="leaf" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#52b788"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>
  </defs>

  <!-- Mark: leaf + biogas bubble -->
  <g transform="translate(12,12)">
    <circle cx="48" cy="14" r="6" fill="#52b788" opacity="0.45"/>
    <circle cx="14" cy="50" r="4" fill="#52b788" opacity="0.35"/>
    <path d="M32 6 C 32 6, 14 14, 14 32 C 14 44, 22 52, 32 52 C 42 52, 50 44, 50 32 C 50 14, 32 6, 32 6 Z"
          fill="url(#leaf)" stroke="#1b3a2d" stroke-width="1.5"/>
    <path d="M32 8 L 32 52" stroke="#1b3a2d" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M32 18 L 22 26" stroke="#1b3a2d" stroke-width="1.1" stroke-linecap="round" fill="none"/>
    <path d="M32 18 L 42 26" stroke="#1b3a2d" stroke-width="1.1" stroke-linecap="round" fill="none"/>
    <path d="M32 30 L 22 40" stroke="#1b3a2d" stroke-width="1.1" stroke-linecap="round" fill="none"/>
    <path d="M32 30 L 42 40" stroke="#1b3a2d" stroke-width="1.1" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(96,36)" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" fill="#1b3a2d">
    <text x="0" y="14" font-size="34" letter-spacing="-0.5">Terra</text>
    <text x="100" y="14" font-size="34" font-weight="600" fill="#2d6a4f">Digester</text>
    <text x="0" y="36" font-size="11" font-weight="500" fill="#4a5e54" letter-spacing="2">ANAEROBIC DIGESTION SYSTEMS</text>
  </g>
</svg>
